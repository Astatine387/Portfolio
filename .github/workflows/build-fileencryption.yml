name: FileEncryption Build Test

on:
  push:
    branches: [main]
    paths:
      - 'Projects/FileEncryption/**'
      - '.github/workflows/build-fileencryption.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Projects/FileEncryption/**'
      - '.github/workflows/build-fileencryption.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # Format Check
  # ============================================================

  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: pipx install clang-format==22.1.5

      - name: Check clang-format
        run: |
          find Projects/FileEncryption/src -name '*.cpp' -o -name '*.h' \
            | xargs clang-format --dry-run --Werror

  # ============================================================
  # Tidy Check
  # ============================================================

  tidy-check:
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'linux'
          target: 'desktop'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '0a434205c521ca43d66921271ae2a1d051e718a5'

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Configure (generate compile_commands.json)
        run: |
          cd Projects/FileEncryption
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynsodium \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (generate AUTOMOC files)
        run: |
          cd Projects/FileEncryption
          cmake --build build

      - name: Run clang-tidy
        run: |
          cd Projects/FileEncryption
          run-clang-tidy -p build "^(?!.*_autogen).*\.(cpp|cxx)$"

  # ============================================================
  # Windows
  # ============================================================

  build-windows-fileencryption:
    needs: format-check
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '0a434205c521ca43d66921271ae2a1d051e718a5'

      - name: Install dependencies
        run: vcpkg install openssl:x64-windows argon2:x64-windows libsodium:x64-windows gtest:x64-windows

      - name: Build
        run: |
          cd Projects/FileEncryption
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DWARNINGS_AS_ERRORS=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release

      - name: Test
        run: |
          cd Projects/FileEncryption
          ctest --test-dir build -C Release --output-on-failure

      - name: Deploy
        run: |
          cd Projects/FileEncryption
          mkdir deploy
          
          copy build\Release\FileEncryption.exe deploy\
          
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            deploy\FileEncryption.exe
          
          copy "$env:VCPKG_ROOT\installed\x64-windows\bin\libcrypto-3-x64.dll" deploy\
          copy "$env:VCPKG_ROOT\installed\x64-windows\bin\libssl-3-x64.dll" deploy\
          copy "$env:VCPKG_ROOT\installed\x64-windows\bin\argon2.dll" deploy\
          
          Get-ChildItem deploy -Recurse | Format-Table Name, Length

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileEncryption-Windows-x64
          path: Projects/FileEncryption/deploy/
          retention-days: 90

  # ============================================================
  # Linux
  # ============================================================

  build-linux-fileencryption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libssl-dev libargon2-dev libsodium-dev libgtest-dev libbenchmark-dev cppcheck lcov

      - name: Run cppcheck
        run: |
          cppcheck \
            --library=qt \
            --suppress=unknownMacro \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            -I Projects/FileEncryption/src \
            Projects/FileEncryption/src/core \
            Projects/FileEncryption/src/gui \
            Projects/FileEncryption/src/utils \
            Projects/FileEncryption/src/common

      - name: Build with Coverage (Debug)
        run: |
          cd Projects/FileEncryption
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCOVERAGE=ON -DWARNINGS_AS_ERRORS=ON
          cmake --build build

      - name: Test
        run: |
          cd Projects/FileEncryption
          ctest --test-dir build --output-on-failure

      - name: Generate Coverage Report
        run: |
          cd Projects/FileEncryption
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info \
            '/usr/*' \
            '*/gtest/*' \
            '*/tests/*' \
            '*/FileEncryption/src/benchmark/benchmark.cpp' \
            '*/FileEncryption/src/common/main.cpp' \
            '*/FileEncryption/src/gui/*' \
            --output-file coverage.info --ignore-errors mismatch,unused
          echo "=== Files in coverage report ==="
          lcov --list coverage.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: Projects/FileEncryption/coverage.info
          flags: fileencryption
          name: fileencryption-coverage
          fail_ci_if_error: false

  # ============================================================
  # Sanitizer
  # ============================================================

  sanitize-linux-fileencryption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/microsoft-prod.sources \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libssl-dev libargon2-dev libsodium-dev libgtest-dev

      - name: Build with AddressSanitizer (Debug)
        run: |
          cd Projects/FileEncryption
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSANITIZE=ON -DWARNINGS_AS_ERRORS=ON
          cmake --build build

      - name: Test
        run: |
          cd Projects/FileEncryption
          ctest --test-dir build --output-on-failure

  # ============================================================
  # Thread Sanitizer
  # ============================================================

  tsan-linux-fileencryption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/microsoft-prod.sources \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libssl-dev libargon2-dev libsodium-dev libgtest-dev

      - name: Build with ThreadSanitizer (Debug)
        run: |
          cd Projects/FileEncryption
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DTHREAD_SANITIZE=ON
          cmake --build build

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          cd Projects/FileEncryption
          ctest --test-dir build --output-on-failure