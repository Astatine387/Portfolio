name: Release FileEncryption

on:
  push:
    tags:
      - 'fileencryption-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # Windows
  # ============================================================

  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgGitCommitId: '0a434205c521ca43d66921271ae2a1d051e718a5'

      - name: Install dependencies
        run: vcpkg install openssl:x64-windows argon2:x64-windows libsodium:x64-windows gtest:x64-windows

      - name: Build
        run: |
          cd Projects/FileEncryption
          cmake -B build -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DWARNINGS_AS_ERRORS=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release

      - name: Test
        run: |
          cd Projects/FileEncryption
          ctest --test-dir build -C Release --output-on-failure

      - name: Deploy and verify
        run: ./.github/scripts/deploy_windows.ps1 -ProjectDir Projects/FileEncryption -AppName FileEncryption

      # Only a folder the check above accepted gets archived, so a release cannot
      # ship a package that is missing a DLL.
      - name: Package
        run: |
          cd Projects/FileEncryption
          Compress-Archive -Path deploy\* -DestinationPath FileEncryption-Windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: FileEncryption-Windows-x64
          path: Projects/FileEncryption/FileEncryption-Windows-x64.zip


  # ============================================================
  # Linux
  # ============================================================

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/microsoft-prod.sources \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libssl-dev libargon2-dev libsodium-dev libgtest-dev file
          sudo apt-get install -y g++-13 qt6-base-dev qt6-base-dev-tools libssl-dev libargon2-dev libsodium-dev libgtest-dev file imagemagick

      - name: Build
        run: |
          cd Projects/FileEncryption
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWARNINGS_AS_ERRORS=ON \
            -DCMAKE_CXX_COMPILER=g++-13
          cmake --build build

      - name: Test
        run: |
          cd Projects/FileEncryption
          ctest --test-dir build --output-on-failure

      # When bumping a version, change the tag and the hash together, and compute the
      # hash from your own download, then compare it with the digest on the release page.
      - name: Bundle (self-contained, extract-and-run)
        env:
          LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          LINUXDEPLOY_QT_URL: https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          LINUXDEPLOY_QT_SHA256: 15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724
        run: |
          cd Projects/FileEncryption

          wget -q "$LINUXDEPLOY_URL" -O linuxdeploy-x86_64.AppImage
          echo "$LINUXDEPLOY_SHA256  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          wget -q "$LINUXDEPLOY_QT_URL" -O linuxdeploy-plugin-qt-x86_64.AppImage
          echo "$LINUXDEPLOY_QT_SHA256  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x linuxdeploy*.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=$(which qmake6)

          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=FileEncryption' \
            'Exec=FileEncryption' 'Icon=fileencryption' 'Categories=Utility;' 'Terminal=false' \
            > fileencryption.desktop

          convert -size 256x256 xc:'#FFFFFF' icon.png

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/FileEncryption \
            --desktop-file fileencryption.desktop \
            --icon-file icon.png \
            --icon-filename fileencryption \
            --plugin qt

          mv AppDir FileEncryption
          tar -czf FileEncryption-Linux-x64.tar.gz FileEncryption

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: FileEncryption-Linux-x64
          path: Projects/FileEncryption/FileEncryption-Linux-x64.tar.gz


  # ============================================================
  # Release
  # ============================================================

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: FileEncryption-Windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: FileEncryption-Linux-x64

      - name: List Artifacts
        run: find . -type f | sort

      - name: Publish release (draft, then publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum FileEncryption-Windows-x64.zip FileEncryption-Linux-x64.tar.gz > SHA256SUMS
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes \
            FileEncryption-Windows-x64.zip FileEncryption-Linux-x64.tar.gz SHA256SUMS
          gh release edit "$TAG" --draft=false