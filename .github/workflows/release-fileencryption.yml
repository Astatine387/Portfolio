name: Release FileEncryption

on:
  push:
    tags:
      - 'fileencryption-v*'

jobs:

  # ============================================================
  # Windows
  # ============================================================

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '0a434205c521ca43d66921271ae2a1d051e718a5'

      - name: Install dependencies
        run: vcpkg install openssl:x64-windows argon2:x64-windows gtest:x64-windows

      - name: Build
        run: |
          cd Projects/FileEncryption
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release

      - name: Test
        run: |
          cd Projects/FileEncryption
          ctest --test-dir build -C Release --output-on-failure

      - name: Deploy
        run: |
          cd Projects/FileEncryption
          mkdir deploy

          copy build\Release\FileEncryption.exe deploy\

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            deploy\FileEncryption.exe

          copy "$env:VCPKG_ROOT\installed\x64-windows\bin\libcrypto-3-x64.dll" deploy\
          copy "$env:VCPKG_ROOT\installed\x64-windows\bin\libssl-3-x64.dll" deploy\
          copy "$env:VCPKG_ROOT\installed\x64-windows\bin\argon2.dll" deploy\

          Compress-Archive -Path deploy\* -DestinationPath FileEncryption-Windows-x64.zip

          Get-ChildItem deploy -Recurse | Format-Table Name, Length

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileEncryption-Windows-x64
          path: Projects/FileEncryption/FileEncryption-Windows-x64.zip


  # ============================================================
  # Linux
  # ============================================================

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/microsoft-prod.sources \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libssl-dev libargon2-dev libgtest-dev file

      - name: Build
        run: |
          cd Projects/FileEncryption
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: |
          cd Projects/FileEncryption
          ctest --test-dir build --output-on-failure

      - name: Bundle (self-contained, extract-and-run)
        run: |
          cd Projects/FileEncryption

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=$(which qmake6)

          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=FileEncryption' \
            'Exec=FileEncryption' 'Icon=fileencryption' 'Categories=Utility;' 'Terminal=false' \
            > fileencryption.desktop

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/FileEncryption \
            --desktop-file fileencryption.desktop \
            --icon-file InputGUI.png \
            --icon-filename fileencryption \
            --plugin qt

          mv AppDir FileEncryption
          tar -czf FileEncryption-Linux-x64.tar.gz FileEncryption

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileEncryption-Linux-x64
          path: Projects/FileEncryption/FileEncryption-Linux-x64.tar.gz


  # ============================================================
  # Release
  # ============================================================

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: FileEncryption-Windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: FileEncryption-Linux-x64

      - name: List Artifacts
        run: find . -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FileEncryption-Windows-x64.zip
            FileEncryption-Linux-x64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}