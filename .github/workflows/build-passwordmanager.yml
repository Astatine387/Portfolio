name: PasswordManager Build Test

on:
  push:
    branches: [main]
    paths:
      - 'Projects/PasswordManager/**'
      - '.github/workflows/build-passwordmanager.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'Projects/PasswordManager/**'
      - '.github/workflows/build-passwordmanager.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-passwordmanager-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # Linux
  #
  # Format, tidy, cppcheck, coverage and the sanitizer share one job so a
  # push starts a single Linux runner instead of four. Each configuration
  # builds into its own directory: the build type, compiler and
  # instrumentation differ between them, and one shared CMakeCache would
  # hand the previous configuration to the next step.
  # ============================================================

  build-linux-passwordmanager:
    name: Lint, coverage and sanitizer (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgGitCommitId: '0a434205c521ca43d66921271ae2a1d051e718a5'

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/microsoft-prod.sources \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install -y g++-13 qt6-base-dev libssl-dev libargon2-dev \
                                  libsodium-dev libgtest-dev cppcheck lcov \
                                  clang-18 clang-tidy-18

      - name: Install clang-format
        run: pipx install clang-format==22.1.5

      - name: Check clang-format
        run: |
          find Projects/PasswordManager/src -name '*.cpp' -o -name '*.h' \
            | xargs clang-format --dry-run --Werror

      - name: Run cppcheck
        run: |
          cppcheck \
            --library=qt \
            --suppress=unknownMacro \
            --suppress=useStlAlgorithm \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=arithOperationsOnVoidPointer \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            -I Projects/PasswordManager/src \
            Projects/PasswordManager/src/core \
            Projects/PasswordManager/src/gui \
            Projects/PasswordManager/src/utils \
            Projects/PasswordManager/src/common

      - name: Configure for clang-tidy (generate compile_commands.json)
        run: |
          cd Projects/PasswordManager
          cmake -B build-tidy \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DWARNINGS_AS_ERRORS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynsodium \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build for clang-tidy (generate AUTOMOC files)
        run: |
          cd Projects/PasswordManager
          cmake --build build-tidy

      - name: Run clang-tidy
        run: |
          cd Projects/PasswordManager
          run-clang-tidy-18 -p build-tidy "^(?!.*_autogen).*\.(cpp|cxx)$"

      - name: Build with Coverage (Debug)
        run: |
          cd Projects/PasswordManager
          cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug -DCOVERAGE=ON -DWARNINGS_AS_ERRORS=ON \
            -DCMAKE_CXX_COMPILER=g++-13
          cmake --build build-cov

      - name: Test
        run: |
          cd Projects/PasswordManager
          ctest --test-dir build-cov --output-on-failure

      - name: Generate Coverage Report
        run: |
          cd Projects/PasswordManager
          lcov --capture --directory build-cov --output-file coverage.info \
            --gcov-tool gcov-13 --ignore-errors mismatch
          lcov --remove coverage.info \
            '/usr/*' \
            '*/gtest/*' \
            '*/tests/*' \
            '*/PasswordManager/src/common/main.cpp' \
            '*/PasswordManager/src/gui/*' \
            --output-file coverage.info --ignore-errors mismatch,unused
          echo "=== Files in coverage report ==="
          lcov --list coverage.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: Projects/PasswordManager/coverage.info
          flags: passwordmanager
          name: passwordmanager-coverage
          fail_ci_if_error: false

      - name: Build with AddressSanitizer (RelWithDebInfo)
        run: |
          cd Projects/PasswordManager
          cmake -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSANITIZE=ON -DWARNINGS_AS_ERRORS=ON \
            -DCMAKE_CXX_COMPILER=g++-13
          cmake --build build-asan

      - name: Test with AddressSanitizer
        run: |
          cd Projects/PasswordManager
          ctest --test-dir build-asan --output-on-failure

  # ============================================================
  # Windows
  #
  # Needs its own runner, so it cannot join the job above. It runs in
  # parallel with it rather than behind a format gate, which keeps the
  # workflow's wall time at the slower of the two jobs.
  # ============================================================

  build-windows-passwordmanager:
    name: Build and test (Windows)
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgGitCommitId: '0a434205c521ca43d66921271ae2a1d051e718a5'

      - name: Install dependencies
        run: vcpkg install openssl:x64-windows argon2:x64-windows libsodium:x64-windows gtest:x64-windows

      - name: Report MSVC toolset version
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
          Get-ChildItem "$vs\VC\Tools\MSVC" | Select-Object -ExpandProperty Name

      - name: Build
        run: |
          cd Projects/PasswordManager
          cmake -B build -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DWARNINGS_AS_ERRORS=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release

      - name: Test
        run: |
          cd Projects/PasswordManager
          ctest --test-dir build -C Release --output-on-failure

      - name: Deploy and verify
        run: ./.github/scripts/deploy_windows.ps1 -ProjectDir Projects/PasswordManager -AppName PasswordManager

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: PasswordManager-Windows-x64
          path: Projects/PasswordManager/deploy/
          retention-days: 90
