name: PasswordManager Build Test

on:
  push:
    branches: [main]
    paths:
      - 'Projects/PasswordManager/**'
      - '.github/workflows/build-passwordmanager.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Projects/PasswordManager/**'
      - '.github/workflows/build-passwordmanager.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # Format Check
  # ============================================================

  format-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: pipx install clang-format==22.1.5

      - name: Check clang-format
        run: |
          find Projects/PasswordManager/src -name '*.cpp' -o -name '*.h' \
            | xargs clang-format --dry-run --Werror

  # ============================================================
  # Tidy Check
  # ============================================================

  tidy-check:
    runs-on: ubuntu-24.04
    needs: format-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'linux'
          target: 'desktop'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '0a434205c521ca43d66921271ae2a1d051e718a5'

      - name: Install clang and clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-18 clang-tidy-18

      - name: Configure (generate compile_commands.json)
        run: |
          cd Projects/PasswordManager
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DWARNINGS_AS_ERRORS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynsodium \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (generate AUTOMOC files)
        run: |
          cd Projects/PasswordManager
          cmake --build build

      - name: Run clang-tidy
        run: |
          cd Projects/PasswordManager
          run-clang-tidy-18 -p build "^(?!.*_autogen).*\.(cpp|cxx)$"

  # ============================================================
  # Windows
  # ============================================================

  build-windows-passwordmanager:
    needs: format-check
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '0a434205c521ca43d66921271ae2a1d051e718a5'

      - name: Install dependencies
        run: vcpkg install openssl:x64-windows argon2:x64-windows libsodium:x64-windows gtest:x64-windows

      - name: Report MSVC toolset version
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
          Get-ChildItem "$vs\VC\Tools\MSVC" | Select-Object -ExpandProperty Name

      - name: Build
        run: |
          cd Projects/PasswordManager
          cmake -B build -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DWARNINGS_AS_ERRORS=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release

      - name: Test
        run: |
          cd Projects/PasswordManager
          ctest --test-dir build -C Release --output-on-failure

      - name: Deploy
        run: |
          cd Projects/PasswordManager
          mkdir deploy

          copy build\Release\PasswordManager.exe deploy\

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            deploy\PasswordManager.exe

          copy "$env:VCPKG_ROOT\installed\x64-windows\bin\libcrypto-3-x64.dll" deploy\
          copy "$env:VCPKG_ROOT\installed\x64-windows\bin\libssl-3-x64.dll" deploy\
          copy "$env:VCPKG_ROOT\installed\x64-windows\bin\argon2.dll" deploy\

          Get-ChildItem deploy -Recurse | Format-Table Name, Length

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasswordManager-Windows-x64
          path: Projects/PasswordManager/deploy/
          retention-days: 90

  # ============================================================
  # Linux
  # ============================================================

  build-linux-passwordmanager:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 qt6-base-dev libssl-dev libargon2-dev libsodium-dev libgtest-dev cppcheck lcov

      - name: Run cppcheck
        run: |
          cppcheck \
            --library=qt \
            --suppress=unknownMacro \
            --suppress=useStlAlgorithm \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=arithOperationsOnVoidPointer \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            -I Projects/PasswordManager/src \
            Projects/PasswordManager/src/core \
            Projects/PasswordManager/src/gui \
            Projects/PasswordManager/src/utils \
            Projects/PasswordManager/src/common

      - name: Build with Coverage (Debug)
        run: |
          cd Projects/PasswordManager
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCOVERAGE=ON -DWARNINGS_AS_ERRORS=ON \
            -DCMAKE_CXX_COMPILER=g++-13
          cmake --build build

      - name: Test
        run: |
          cd Projects/PasswordManager
          ctest --test-dir build --output-on-failure

      - name: Generate Coverage Report
        run: |
          cd Projects/PasswordManager
          lcov --capture --directory build --output-file coverage.info \
            --gcov-tool gcov-13 --ignore-errors mismatch
          lcov --remove coverage.info \
            '/usr/*' \
            '*/gtest/*' \
            '*/tests/*' \
            '*/PasswordManager/src/common/main.cpp' \
            '*/PasswordManager/src/gui/*' \
            --output-file coverage.info --ignore-errors mismatch,unused
          echo "=== Files in coverage report ==="
          lcov --list coverage.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: Projects/PasswordManager/coverage.info
          flags: passwordmanager
          name: passwordmanager-coverage
          fail_ci_if_error: false

  # ============================================================
  # Sanitizer
  # ============================================================

  sanitize-linux-passwordmanager:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/microsoft-prod.sources \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install -y g++-13 qt6-base-dev libssl-dev libargon2-dev libsodium-dev libgtest-dev

      - name: Build with AddressSanitizer (Debug)
        run: |
          cd Projects/PasswordManager
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSANITIZE=ON -DWARNINGS_AS_ERRORS=ON \
            -DCMAKE_CXX_COMPILER=g++-13
          cmake --build build

      - name: Test
        run: |
          cd Projects/PasswordManager
          ctest --test-dir build --output-on-failure