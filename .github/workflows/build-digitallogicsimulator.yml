name: DigitalLogicSimulator Build Test

on:
  push:
    branches: [main]
    paths:
      - 'Projects/DigitalLogicSimulator/**'
      - '.github/workflows/build-digitallogicsimulator.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Projects/DigitalLogicSimulator/**'
      - '.github/workflows/build-digitallogicsimulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-digitallogicsimulator-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # Linux
  #
  # Format, tidy, cppcheck, coverage and the sanitizers share one job so a
  # push starts a single Linux runner instead of four. Each configuration
  # builds into its own directory: the build type and instrumentation
  # differ between them, and one shared CMakeCache would hand the previous
  # configuration to the next step.
  # ============================================================

  build-linux-digitallogicsimulator:
    name: Lint, coverage and sanitizers (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/microsoft-prod.sources \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libbenchmark-dev cppcheck lcov clang-tidy

      - name: Install clang-format
        run: pipx install clang-format==22.1.5

      - name: Check clang-format
        run: |
          find Projects/DigitalLogicSimulator/src -name '*.cpp' -o -name '*.h' \
            | xargs clang-format --dry-run --Werror

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            -I Projects/DigitalLogicSimulator/src \
            Projects/DigitalLogicSimulator/src/core \
            Projects/DigitalLogicSimulator/src/parser \
            Projects/DigitalLogicSimulator/src/common

      - name: Configure for clang-tidy (generate compile_commands.json)
        run: |
          cd Projects/DigitalLogicSimulator
          cmake -B build-tidy \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          cd Projects/DigitalLogicSimulator
          run-clang-tidy -p build-tidy

      - name: Build with Coverage (Debug)
        run: |
          cd Projects/DigitalLogicSimulator
          cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug -DCOVERAGE=ON
          cmake --build build-cov

      - name: Test
        run: |
          cd Projects/DigitalLogicSimulator
          ctest --test-dir build-cov --output-on-failure

      - name: Generate Coverage Report
        run: |
          cd Projects/DigitalLogicSimulator
          lcov --capture --directory build-cov --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info \
            '/usr/*' \
            '*/gtest/*' \
            '*/tests/*' \
            '*/DigitalLogicSimulator/src/benchmark/benchmark.cpp' \
            '*/DigitalLogicSimulator/src/common/main.cpp' \
            --output-file coverage.info --ignore-errors mismatch,unused,empty
          echo "=== Files in coverage report ==="
          lcov --list coverage.info --ignore-errors empty

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: Projects/DigitalLogicSimulator/coverage.info
          flags: digitallogicsimulator
          name: digitallogicsimulator-coverage
          fail_ci_if_error: false

      - name: Build with AddressSanitizer + UndefinedBehaviorSanitizer (Debug)
        run: |
          cd Projects/DigitalLogicSimulator
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DSANITIZE=ON
          cmake --build build-asan

      - name: Test with sanitizers
        run: |
          cd Projects/DigitalLogicSimulator
          ctest --test-dir build-asan --output-on-failure

  # ============================================================
  # Windows
  #
  # Needs its own runner, so it cannot join the job above. It runs in
  # parallel with it rather than behind a format gate, which keeps the
  # workflow's wall time at the slower of the two jobs.
  # ============================================================

  build-windows-digitallogicsimulator:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgGitCommitId: '0a434205c521ca43d66921271ae2a1d051e718a5'

      - name: Install dependencies
        run: vcpkg install gtest:x64-windows benchmark:x64-windows

      - name: Build
        run: |
          cd Projects/DigitalLogicSimulator
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release

      - name: Test
        run: |
          cd Projects/DigitalLogicSimulator
          ctest --test-dir build -C Release --output-on-failure

      - name: Deploy
        run: |
          cd Projects/DigitalLogicSimulator
          mkdir deploy
          copy build\Release\DigitalLogicSimulator.exe deploy\
          Get-ChildItem deploy -Recurse | Format-Table Name, Length

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: DigitalLogicSimulator-Windows-x64
          path: Projects/DigitalLogicSimulator/deploy/
          retention-days: 90
